<text x="40.0" y="590.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Por qué importa:</text>
<text x="160.0" y="590.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="normal">ST_0260 parece el cuello de botella de la línea. La máquina anterior (ST_0259) está saturada 6,7 h/día esperando por ella, y la siguiente (ST_0265) desabastecida 4,2 h/día.</text>
<text x="160.0" y="612.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="normal">Pero su parada propia registrada es solo de 0,7 h/día: el tiempo sin registrar podría ser la parada que falta.</text>
<text x="40.0" y="646.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Preguntas:</text>
<text x="160.0" y="646.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="normal">1. ¿Qué hace la máquina durante ese tiempo? ¿Paradas no codificadas como TAP, microparadas, cambios, pruebas...?</text>
<text x="160.0" y="668.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="normal">2. ¿Es un fallo de la señal / del sistema de captura de esta estación?</text>
<text x="160.0" y="690.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="normal">3. ¿Debemos contarlo como parada propia (TAP) en el análisis?</text>
</svg>